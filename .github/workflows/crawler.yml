name: 戏曲演出数据爬取

on:
  schedule:
    # 每天执行2次：北京时间早8点和晚20点（UTC时间 0:00 和 12:00）
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行爬虫
        run: node js/crawler.js
        timeout-minutes: 35

      - name: 提交并推送更新
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/performances.json
          git diff --staged --quiet || (
            git commit -m "自动更新: 多源爬取戏曲演出数据 v2.0（百度+Bing+微信+猫眼+大麦+摩天轮+永乐+戏曲网+B站+微博+抖音+小红书）[$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')]"
            git push
          )
