name: 戏曲演出数据爬取

on:
  schedule:
    # 每天北京时间 8:00 和 20:00 执行
    - cron: '0 0,12 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行爬虫
        run: node js/crawler.js

      - name: 提交并推送更新
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/performances.json
          git diff --staged --quiet || (
            git commit -m "自动更新: 爬取戏曲演出数据 [$(date +'%Y-%m-%d %H:%M')]"
            git push
          )
