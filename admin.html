<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演出管理 - 中国戏曲演出地图</title>
  <!-- 字体加载优化：预连接 + font-display: swap + 延迟加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 系统字体优先，Noto Sans SC 作为增强字体异步加载 -->
  <style>
    /* 本地系统字体优先，Noto Sans SC 作为可选增强 */
    @font-face {
      font-family: 'Noto Sans SC';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Noto Sans SC'), local('NotoSansSC-Regular'),
           url(https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400&display=swap) format('woff2');
    }
    @font-face {
      font-family: 'Noto Sans SC';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: local('Noto Sans SC'), local('NotoSansSC-Medium'),
           url(https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500&display=swap) format('woff2');
    }
    @font-face {
      font-family: 'Noto Sans SC';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local('Noto Sans SC'), local('NotoSansSC-Bold'),
           url(https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700&display=swap) format('woff2');
    }
  </style>
  <!-- 异步加载 Google Fonts CSS（不阻塞渲染） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all';this.onload=null">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img class="navbar-logo" src="img/logo.png" alt="唱戏的小乌龟">
      <span class="navbar-title">演出管理</span>
    </div>
    <div class="navbar-actions">
      <button class="theme-btn" id="themeBtn" title="切换主题">🌓</button>
      <a href="index.html" class="btn btn-outline">🗺️ 返回地图</a>
    </div>
  </nav>

  <div class="admin-container">
    <div class="admin-header">
      <h1>演出信息管理</h1>
      <p>添加、编辑或删除戏曲演出信息，所有手动录入的数据可通过开关控制显示</p>
    </div>

    <!-- 手动数据开关 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>👁️</span>
          数据显示控制
        </div>
        <label class="toggle-switch">
          <span class="toggle-label">显示手动录入数据</span>
          <input type="checkbox" id="manualToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- 演出录入表单 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>📝</span>
          <span id="formTitle">添加演出信息</span>
        </div>
      </div>
      <form id="perfForm">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">演出名称 <span class="required">*</span></label>
            <input type="text" name="name" class="form-input" placeholder="例：京剧《贵妃醉酒》" required>
          </div>
          <div class="form-group">
            <label class="form-label">剧种 <span class="required">*</span></label>
            <select name="genre" class="form-select" required>
              <option value="">请选择剧种</option>
              <optgroup label="── 五大剧种 ──">
                <option value="京剧">京剧</option>
                <option value="豫剧">豫剧</option>
                <option value="越剧">越剧</option>
                <option value="评剧">评剧</option>
                <option value="黄梅戏">黄梅戏</option>
              </optgroup>
              <optgroup label="── 重要剧种 ──">
                <option value="昆曲">昆曲</option>
                <option value="川剧">川剧</option>
                <option value="粤剧">粤剧</option>
                <option value="秦腔">秦腔</option>
                <option value="藏戏">藏戏</option>
                <option value="汉剧">汉剧</option>
                <option value="湘剧">湘剧</option>
                <option value="晋剧">晋剧</option>
                <option value="河北梆子">河北梆子</option>
                <option value="潮剧">潮剧</option>
                <option value="梨园戏">梨园戏</option>
                <option value="莆仙戏">莆仙戏</option>
              </optgroup>
              <optgroup label="── 北方剧种 ──">
                <option value="二人台">二人台</option>
                <option value="吉剧">吉剧</option>
                <option value="龙江剧">龙江剧</option>
                <option value="眉户戏">眉户戏</option>
                <option value="碗碗腔">碗碗腔</option>
                <option value="二人转">二人转</option>
                <option value="吕剧">吕剧</option>
                <option value="柳琴戏">柳琴戏</option>
                <option value="茂腔">茂腔</option>
                <option value="五音戏">五音戏</option>
                <option value="老腔">老腔</option>
                <option value="锣鼓杂戏">锣鼓杂戏</option>
              </optgroup>
              <optgroup label="── 南方剧种 ──">
                <option value="沪剧">沪剧</option>
                <option value="闽剧">闽剧</option>
                <option value="楚剧">楚剧</option>
                <option value="赣剧">赣剧</option>
                <option value="桂剧">桂剧</option>
                <option value="琼剧">琼剧</option>
                <option value="高甲戏">高甲戏</option>
                <option value="芗剧（歌仔戏）">芗剧（歌仔戏）</option>
                <option value="绍剧">绍剧</option>
                <option value="婺剧">婺剧</option>
                <option value="淮剧">淮剧</option>
                <option value="扬剧">扬剧</option>
                <option value="锡剧">锡剧</option>
                <option value="庐剧">庐剧</option>
                <option value="徽剧">徽剧</option>
                <option value="滇剧">滇剧</option>
                <option value="黔剧">黔剧</option>
                <option value="花鼓戏">花鼓戏</option>
                <option value="采茶戏">采茶戏</option>
                <option value="花灯戏">花灯戏</option>
                <option value="秧歌剧">秧歌剧</option>
                <option value="道情戏">道情戏</option>
                <option value="傩戏">傩戏</option>
                <option value="安顺地戏">安顺地戏</option>
                <option value="打城戏">打城戏</option>
                <option value="临高人偶戏">临高人偶戏</option>
              </optgroup>
              <optgroup label="── 其他 ──">
                <option value="折子戏">折子戏</option>
                <option value="其他">其他</option>
              </optgroup>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">省份 <span class="required">*</span></label>
            <input type="text" name="province" class="form-input" placeholder="例：北京市" required>
          </div>
          <div class="form-group">
            <label class="form-label">城市 <span class="required">*</span></label>
            <input type="text" name="city" class="form-input" placeholder="例：北京" required>
          </div>
          <div class="form-group full-width">
            <label class="form-label">详细地址 <span class="required">*</span></label>
            <div class="form-input-row">
              <input type="text" name="address" class="form-input" placeholder="例：国家大剧院" required>
              <button type="button" class="btn-geocode" id="geocodeBtn" title="根据省份+城市+地址自动获取经纬度">
                <span class="geocode-icon">📍</span> 自动定位
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">演出团体</label>
            <input type="text" name="troupe" class="form-input" placeholder="例：北京京剧院">
          </div>
          <div class="form-group">
            <label class="form-label">开始日期 <span class="required">*</span></label>
            <input type="date" name="startDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">结束日期 <span class="required">*</span></label>
            <input type="date" name="endDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">经度 (lng) <span class="required">*</span> <span class="label-hint">自动获取</span></label>
            <input type="text" name="lng" class="form-input form-input-readonly" placeholder="点击上方"自动定位"获取" readonly>
          </div>
          <div class="form-group">
            <label class="form-label">纬度 (lat) <span class="required">*</span> <span class="label-hint">自动获取</span></label>
            <input type="text" name="lat" class="form-input form-input-readonly" placeholder="点击上方"自动定位"获取" readonly>
          </div>
          <div class="form-group full-width">
            <label class="form-label">演出描述</label>
            <textarea name="description" class="form-textarea" placeholder="简要描述演出内容..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">取消</button>
          <button type="submit" class="btn-submit" id="submitBtn">💾 保存演出</button>
        </div>
      </form>
    </div>

    <!-- 演出列表 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>📋</span>
          演出列表
        </div>
        <span style="font-size:13px;color:var(--text-muted);" id="perfCount">共 0 条</span>
      </div>
      <div class="perf-list-vertical" id="perfList">
        <div class="empty-state">
          <div class="icon">🎭</div>
          <p>加载中...</p>
        </div>
      </div>
    </div>

    <!-- 提示 -->
    <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px;">
      <p>💡 提示：修改数据后会自动下载更新后的 JSON 文件，请将其替换到项目的 <code>data/</code> 目录中并 commit 到 GitHub。</p>
    </div>
  </div>

  <script src="js/log.js"></script>
  <script src="js/theme.js"></script>
  <script>ThemeManager.init();</script>
  <script src="js/autocomplete.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
