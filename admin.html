<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演出管理 - 中国戏曲演出地图</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img class="navbar-logo" src="img/logo.svg" alt="戏曲地图图标">
      <span class="navbar-title">演出管理</span>
    </div>
    <div class="navbar-actions">
      <a href="index.html" class="btn btn-outline">🗺️ 返回地图</a>
    </div>
  </nav>

  <div class="admin-container">
    <div class="admin-header">
      <h1>演出信息管理</h1>
      <p>添加、编辑或删除戏曲演出信息，所有手动录入的数据可通过开关控制显示</p>
    </div>

    <!-- 手动数据开关 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>👁️</span>
          数据显示控制
        </div>
        <label class="toggle-switch">
          <span class="toggle-label">显示手动录入数据</span>
          <input type="checkbox" id="manualToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- 演出录入表单 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>📝</span>
          <span id="formTitle">添加演出信息</span>
        </div>
      </div>
      <form id="perfForm">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">演出名称 <span class="required">*</span></label>
            <input type="text" name="name" class="form-input" placeholder="例：京剧《贵妃醉酒》" required>
          </div>
          <div class="form-group">
            <label class="form-label">剧种 <span class="required">*</span></label>
            <select name="genre" class="form-select" required>
              <option value="">请选择剧种</option>
              <option value="京剧">京剧</option>
              <option value="越剧">越剧</option>
              <option value="豫剧">豫剧</option>
              <option value="黄梅戏">黄梅戏</option>
              <option value="评剧">评剧</option>
              <option value="昆曲">昆曲</option>
              <option value="川剧">川剧</option>
              <option value="秦腔">秦腔</option>
              <option value="粤剧">粤剧</option>
              <option value="晋剧">晋剧</option>
              <option value="河北梆子">河北梆子</option>
              <option value="沪剧">沪剧</option>
              <option value="花鼓戏">花鼓戏</option>
              <option value="二人转">二人转</option>
              <option value="皮影戏">皮影戏</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">省份 <span class="required">*</span></label>
            <input type="text" name="province" class="form-input" placeholder="例：北京市" required>
          </div>
          <div class="form-group">
            <label class="form-label">城市 <span class="required">*</span></label>
            <input type="text" name="city" class="form-input" placeholder="例：北京" required>
          </div>
          <div class="form-group">
            <label class="form-label">详细地址 <span class="required">*</span></label>
            <input type="text" name="address" class="form-input" placeholder="例：国家大剧院" required>
          </div>
          <div class="form-group">
            <label class="form-label">演出团体</label>
            <input type="text" name="troupe" class="form-input" placeholder="例：北京京剧院">
          </div>
          <div class="form-group">
            <label class="form-label">开始日期 <span class="required">*</span></label>
            <input type="date" name="startDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">结束日期 <span class="required">*</span></label>
            <input type="date" name="endDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">经度 (lng) <span class="required">*</span></label>
            <input type="number" step="0.0001" name="lng" class="form-input" placeholder="例：116.3838" required>
          </div>
          <div class="form-group">
            <label class="form-label">纬度 (lat) <span class="required">*</span></label>
            <input type="number" step="0.0001" name="lat" class="form-input" placeholder="例：39.9131" required>
          </div>
          <div class="form-group full-width">
            <label class="form-label">演出描述</label>
            <textarea name="description" class="form-textarea" placeholder="简要描述演出内容..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">取消</button>
          <button type="submit" class="btn-submit" id="submitBtn">💾 保存演出</button>
        </div>
      </form>
    </div>

    <!-- 演出列表 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>📋</span>
          演出列表
        </div>
        <span style="font-size:13px;color:var(--text-muted);" id="perfCount">共 0 条</span>
      </div>
      <div class="perf-list-vertical" id="perfList">
        <div class="empty-state">
          <div class="icon">🎭</div>
          <p>加载中...</p>
        </div>
      </div>
    </div>

    <!-- 提示 -->
    <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px;">
      <p>💡 提示：修改数据后会自动下载更新后的 JSON 文件，请将其替换到项目的 <code>data/</code> 目录中并 commit 到 GitHub。</p>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
