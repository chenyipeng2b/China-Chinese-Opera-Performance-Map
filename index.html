<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国戏曲演出地图</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img class="navbar-logo" src="img/logo.png" alt="唱戏的小乌龟">
            <span class="navbar-title">中国戏曲演出地图</span>
        </div>
        <div class="navbar-actions">
            <button class="mobile-panel-btn" id="mobilePanelBtn" title="面板">☰</button>
            <a href="admin.html" class="btn btn-outline">📝 管理演出</a>
        </div>
    </nav>

    <!-- 移动端面板遮罩 -->
    <div class="panel-overlay" id="panelOverlay"></div>

    <div class="main-container">
        <!-- 左侧面板 -->
        <aside class="side-panel" id="sidePanel">
            <div class="panel-card">
                <h3>🎨 图例说明</h3>
                <div class="legend-item"><span class="legend-dot red"></span><div><strong>正在演出</strong><small>进行中</small></div></div>
                <div class="legend-item"><span class="legend-dot yellow"></span><div><strong>即将演出</strong><small>已排期</small></div></div>
                <div class="legend-item"><span class="legend-dot black"></span><div><strong>已结束</strong><small>3天后消失</small></div></div>
            </div>
            <div class="panel-card">
                <h3>📊 演出统计</h3>
                <div class="stat-grid">
                    <div class="stat-item"><span class="stat-num red" id="sLive">0</span><span class="stat-label">演出中</span></div>
                    <div class="stat-item"><span class="stat-num yellow" id="sUpcoming">0</span><span class="stat-label">即将开始</span></div>
                    <div class="stat-item"><span class="stat-num gray" id="sEnded">0</span><span class="stat-label">已结束</span></div>
                    <div class="stat-item"><span class="stat-num" id="sTotal">0</span><span class="stat-label">总计</span></div>
                </div>
            </div>
            <div class="panel-card">
                <h3>🔍 筛选</h3>
                <label class="filter-tag active"><input type="checkbox" checked data-filter="all"> 全部</label>
                <label class="filter-tag active"><input type="checkbox" checked data-filter="live"> 演出中</label>
                <label class="filter-tag active"><input type="checkbox" checked data-filter="upcoming"> 即将演出</label>
                <label class="filter-tag active"><input type="checkbox" checked data-filter="ended"> 已结束</label>
            </div>
        </aside>

        <!-- 地图区域 -->
        <section class="map-section" id="mapSection">
            <div class="loading-overlay" id="loading">
                <div class="loading-spinner"></div>
                <p>正在加载中国地图数据...</p>
            </div>
            <div class="error-overlay" id="error">
                <h2>⚠️ 加载失败</h2>
                <p id="errorMsg"></p>
            </div>
            <div id="mapChart"></div>
            <div class="map-zoom-hint" id="zoomHint">🖱️ 滚轮缩放 · 拖拽平移</div>
        </section>
    </div>

    <!-- 底部演出条 -->
    <div class="perf-bar">
        <div class="perf-bar-title">📅 近期演出</div>
        <div class="perf-list" id="perfList"></div>
    </div>

    <footer class="footer">
        数据来源：网络爬取 + 用户贡献 | Powered by GitHub Pages
    </footer>

    <!-- 悬浮提示 -->
    <div class="info-tooltip" id="tooltip"></div>

    <script src="js/log.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
