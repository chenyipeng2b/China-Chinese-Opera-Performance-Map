<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 米色外圈背景 -->
  <circle cx="100" cy="100" r="98" fill="#E8E4D0"/>

  <!-- 暖橙色圆形主背景（B站风格） -->
  <circle cx="100" cy="100" r="86" fill="#F5C28A"/>

  <!-- 戏冠底部束带 -->
  <ellipse cx="100" cy="58" rx="40" ry="8" fill="#1a1a1a"/>

  <!-- 戏冠主体（黑色髻冠） -->
  <path d="M 70 60
           Q 65 30 100 22
           Q 135 30 130 60
           Q 130 65 125 66
           L 75 66
           Q 70 65 70 60 Z"
        fill="#1a1a1a"/>

  <!-- 戏冠顶部高髻圆结 -->
  <ellipse cx="100" cy="22" rx="14" ry="10" fill="#1a1a1a"/>

  <!-- 髻冠中部装饰带 -->
  <path d="M 72 50 Q 100 56 128 50" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>

  <!-- 后垂发带 -->
  <path d="M 78 62
           Q 72 90 68 130
           Q 66 145 70 160"
        stroke="#1a1a1a" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- 脸庞轮廓 -->
  <path d="M 82 70
           Q 78 95 84 120
           Q 90 140 100 145
           Q 110 140 116 120
           Q 122 95 118 70 Z"
        fill="#F5C28A" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 耳朵 -->
  <path d="M 80 100 Q 76 108 80 115 Q 84 113 84 105 Z"
        fill="#F5C28A" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M 120 100 Q 124 108 120 115 Q 116 113 116 105 Z"
        fill="#F5C28A" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- 左眉（粗黑上扬） -->
  <path d="M 84 92 Q 90 88 96 93" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 右眉（粗黑上扬） -->
  <path d="M 104 93 Q 110 88 116 92" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 左眼 -->
  <circle cx="91" cy="103" r="2.5" fill="#1a1a1a"/>

  <!-- 右眼 -->
  <circle cx="109" cy="103" r="2.5" fill="#1a1a1a"/>

  <!-- 鼻子 -->
  <path d="M 100 108 Q 97 118 100 122 Q 103 118 100 108"
        fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 八字胡（两撇） -->
  <path d="M 86 128 Q 92 132 98 128" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 102 128 Q 108 132 114 128" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 山羊胡（下巴处） -->
  <path d="M 95 134 Q 100 144 105 134
           M 95 134 Q 92 142 96 148
           M 105 134 Q 108 142 104 148"
        stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 嘴巴 -->
  <path d="M 94 130 Q 100 132 106 130" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 衣领/戏服衣襟（V字领） -->
  <path d="M 65 165
           Q 75 150 95 152
           L 100 168
           L 105 152
           Q 125 150 135 165
           L 135 180
           L 65 180 Z"
        fill="#1a1a1a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>

  <!-- 衣襟中间露出的内衬（暖橙色） -->
  <path d="M 88 162 L 100 180 L 112 162 Q 105 158 100 162 Q 95 158 88 162 Z"
        fill="#F5C28A" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 衣襟领口白色斜线纹理（模拟戏服褶皱） -->
  <path d="M 80 170 L 90 175" stroke="#E8E4D0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 75 175 L 88 178" stroke="#E8E4D0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 112 175 L 122 170" stroke="#E8E4D0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 112 178 L 125 175" stroke="#E8E4D0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>